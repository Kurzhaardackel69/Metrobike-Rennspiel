name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  display:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install multiplayer server dependencies
        run: npm ci --prefix multiplayer
      - name: Test game logic
        run: node --test tests/*.test.mjs
      - name: Install responsive test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Check display sizes and Spotify session
        run: node scripts/check-responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: display-checks
          path: artifacts/display-checks/
          retention-days: 14
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Bundle offline game
        run: node scripts/prepare-android.mjs
      - name: Build signed test APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/apk/Metorbike-Racing-1.7.0-debug.apk
          sha256sum artifacts/apk/*.apk > artifacts/apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Metorbike-Racing-APK
          path: artifacts/apk/
          retention-days: 30
